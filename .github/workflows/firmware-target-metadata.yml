name: firmware-target-metadata
on:
  push:
    branches: [firmware]
  pull_request:
    branches: [firmware]
jobs:
  keil-project-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all referenced Keil source paths
        run: python firmware/tools/check_target_project.py
      - name: Verify original Yuntu SDK, YCT and startup source blobs
        run: python firmware/tools/check_platform_origin.py
