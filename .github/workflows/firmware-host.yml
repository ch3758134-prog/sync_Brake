name: firmware-host
on:
  push:
    branches: [firmware]
  pull_request:
    branches: [firmware]
jobs:
  host:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        env:
          CC: ${{ matrix.compiler }}
        run: cmake -S firmware -B build/firmware -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build/firmware --parallel
      - name: Test
        run: ctest --test-dir build/firmware --output-on-failure
